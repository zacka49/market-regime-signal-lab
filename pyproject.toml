[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-signal-lab"
version = "0.2.0"
description = "Quantitative research lab: stochastic-process simulation, regime detection, alpha research and portfolio construction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
data = ["yfinance>=0.2"]
viz = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:hmmlearn",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
